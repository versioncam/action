name: Versioncam
description: Record, check and publish true product videos from your CI.
author: Peter Bulovec
branding:
  icon: video
  color: blue

inputs:
  mode:
    description: >-
      check records every clip and fails when one no longer matches the app.
      render encodes what the last check recorded and uploads the videos.
      publish sends what the last check recorded to version.cam.
    required: false
    default: check
  working-directory:
    description: The directory that holds versioncam.config.ts, from the repository's root.
    required: false
    default: .
  clips:
    description: Clip ids, separated by spaces. Empty means every clip.
    required: false
    default: ""
  url:
    description: >-
      Where the app is already running, if it is. Given to versioncam as
      VERSIONCAM_BASE_URL, for the config to read.
    required: false
    default: ""
  storage-state:
    description: >-
      A saved browser session, the JSON that versioncam login writes, from a
      secret. Written to a file only this job can read, whose path is given to
      versioncam as VERSIONCAM_STORAGE_STATE, for the config to read.
    required: false
    default: ""
  install-browser:
    description: >-
      Run versioncam install --with-deps first, for the Chromium versioncam
      records with. publish needs no browser and skips it.
    required: false
    default: "true"
  comment:
    description: >-
      On a pull request, comment when the check fails, and rewrite the comment
      when a later run passes.
    required: false
    default: "true"
  sequence:
    description: >-
      In render mode, also stitch the rendered clips into one piece, in the
      order of the config's sequence when it has one.
    required: false
    default: "false"
  api:
    description: Where publish sends the recordings.
    required: false
    default: https://api.version.cam
  github-token:
    description: The token the pull request comment is written with.
    required: false
    default: ${{ github.token }}

outputs:
  result:
    description: pass or fail.
    value: ${{ steps.result.outputs.result }}
  report:
    description: The path of the JSON report versioncam wrote, when it wrote one.
    value: ${{ steps.run.outputs.report }}
  urls:
    description: publish only. The living URLs, one a line.
    value: ${{ steps.summary.outputs.urls }}

# A thin wrapper. versioncam does the work; the Action adds only what a
# command line cannot: the pull request comment, the artifacts, the job
# summary and GitHub's token for publish. Inputs reach scripts through env,
# never through ${{ }} inside a script, so no input can become shell code.
runs:
  using: composite
  steps:
    - name: Check the inputs and find the repository's versioncam
      id: setup
      shell: bash
      env:
        VERSIONCAM_ACTION_MODE: ${{ inputs.mode }}
        VERSIONCAM_ACTION_WORKING_DIRECTORY: ${{ inputs.working-directory }}
        VERSIONCAM_ACTION_INSTALL_BROWSER: ${{ inputs.install-browser }}
        VERSIONCAM_ACTION_COMMENT: ${{ inputs.comment }}
        VERSIONCAM_ACTION_STORAGE_STATE: ${{ inputs.storage-state }}
      run: |
        # versioncam: the inputs, the job's permissions and the repository's own versioncam, before anything runs
        node "$GITHUB_ACTION_PATH/scripts/setup.mjs"

    - name: Install the browser versioncam records with
      if: inputs.install-browser == 'true' && inputs.mode != 'publish'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        VERSIONCAM_ACTION_BIN: ${{ steps.setup.outputs.bin }}
      run: |
        # versioncam install --with-deps: the Chromium this versioncam records with, and its system libraries
        "$VERSIONCAM_ACTION_BIN" install --with-deps

    - name: Run versioncam
      id: run
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        VERSIONCAM_ACTION_MODE: ${{ inputs.mode }}
        VERSIONCAM_ACTION_BIN: ${{ steps.setup.outputs.bin }}
        VERSIONCAM_ACTION_SEQUENCE: ${{ inputs.sequence }}
        VERSIONCAM_ACTION_DIR: ${{ steps.setup.outputs.dir }}
        VERSIONCAM_ACTION_CLIPS: ${{ inputs.clips }}
        VERSIONCAM_ACTION_URL: ${{ inputs.url }}
        VERSIONCAM_ACTION_SESSION: ${{ steps.setup.outputs.storage-state }}
        VERSIONCAM_ACTION_API: ${{ inputs.api }}
      run: |
        # versioncam check, render or publish: its output here as it comes, its exit status kept for the Action's last step
        report="$VERSIONCAM_ACTION_DIR/$VERSIONCAM_ACTION_MODE.json"
        IFS=$' \t\n' read -r -d '' -a clips <<< "$VERSIONCAM_ACTION_CLIPS" || true

        # Set only when there is something in them: a config that reads
        # `process.env.VERSIONCAM_BASE_URL ?? "http://localhost:5173"` must
        # never be handed an empty string.
        if [ -n "$VERSIONCAM_ACTION_URL" ]; then export VERSIONCAM_BASE_URL="$VERSIONCAM_ACTION_URL"; fi
        if [ -n "$VERSIONCAM_ACTION_SESSION" ]; then export VERSIONCAM_STORAGE_STATE="$VERSIONCAM_ACTION_SESSION"; fi

        status=0
        case "$VERSIONCAM_ACTION_MODE" in
          check)
            "$VERSIONCAM_ACTION_BIN" check --report "$report" ${clips[@]+"${clips[@]}"} || status=$?
            ;;
          render)
            sequence=()
            if [ "$VERSIONCAM_ACTION_SEQUENCE" = "true" ]; then sequence=(--sequence); fi
            "$VERSIONCAM_ACTION_BIN" render ${sequence[@]+"${sequence[@]}"} --report "$report" ${clips[@]+"${clips[@]}"} || status=$?
            ;;
          publish)
            # GitHub's token for version.cam: asked for now, masked at once,
            # kept in this shell only, and given to the one command that
            # needs it. Never printed, never written to a file or an output.
            token="$(curl -sS --fail --retry 3 \
              -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=version.cam" \
              | node "$GITHUB_ACTION_PATH/scripts/oidc.mjs")" || {
              echo "::error::GitHub gave this job no token for version.cam; the lines above say why."
              exit 1
            }
            echo "::add-mask::$token"
            VERSIONCAM_OIDC_TOKEN="$token" VERSIONCAM_API="$VERSIONCAM_ACTION_API" \
              "$VERSIONCAM_ACTION_BIN" publish --report "$report" ${clips[@]+"${clips[@]}"} || status=$?
            unset token
            ;;
        esac

        echo "status=$status" >> "$GITHUB_OUTPUT"
        if [ -f "$report" ]; then echo "report=$report" >> "$GITHUB_OUTPUT"; fi

    - name: Gather what to upload
      id: files
      if: ${{ !cancelled() && steps.run.outcome == 'success' && inputs.mode != 'publish' }}
      shell: bash
      env:
        VERSIONCAM_ACTION_MODE: ${{ inputs.mode }}
        VERSIONCAM_ACTION_REPORT: ${{ steps.run.outputs.report }}
        VERSIONCAM_ACTION_DIR: ${{ steps.setup.outputs.dir }}
      run: |
        # versioncam: what the Action uploads, from the report
        node "$GITHUB_ACTION_PATH/scripts/files.mjs" --mode "$VERSIONCAM_ACTION_MODE" \
          --report "$VERSIONCAM_ACTION_REPORT" --into "$VERSIONCAM_ACTION_DIR/failures"

    # The upload runs in every customer's job, with its tokens, so it is
    # pinned to a commit: a tag moved upstream cannot change what runs there.
    # Dependabot proposes the next commit, and a release of this Action ships it.
    - name: Upload the pictures of the failing clips
      id: upload-failures
      if: ${{ !cancelled() && inputs.mode == 'check' && steps.files.outputs.files != '' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: versioncam-failures
        path: ${{ steps.files.outputs.files }}
        if-no-files-found: warn

    - name: Upload the renders
      id: upload-renders
      if: ${{ !cancelled() && inputs.mode == 'render' && steps.files.outputs.files != '' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: versioncam-renders
        path: ${{ steps.files.outputs.files }}
        if-no-files-found: warn

    - name: Write the job summary
      id: summary
      if: ${{ !cancelled() && steps.run.outcome == 'success' }}
      shell: bash
      env:
        VERSIONCAM_ACTION_MODE: ${{ inputs.mode }}
        VERSIONCAM_ACTION_REPORT: ${{ steps.run.outputs.report }}
        VERSIONCAM_ACTION_STATUS: ${{ steps.run.outputs.status }}
        VERSIONCAM_ACTION_ARTIFACT_URL: ${{ steps.upload-failures.outputs.artifact-url || steps.upload-renders.outputs.artifact-url }}
        VERSIONCAM_ACTION_WORKING_DIRECTORY: ${{ inputs.working-directory }}
      run: |
        # versioncam: the job summary
        node "$GITHUB_ACTION_PATH/scripts/summary.mjs" --mode "$VERSIONCAM_ACTION_MODE" \
          --report "$VERSIONCAM_ACTION_REPORT" --status "$VERSIONCAM_ACTION_STATUS" \
          --artifact-url "$VERSIONCAM_ACTION_ARTIFACT_URL" \
          --working-directory "$VERSIONCAM_ACTION_WORKING_DIRECTORY"

    - name: Comment on the pull request
      if: ${{ !cancelled() && steps.run.outcome == 'success' && inputs.mode == 'check' && inputs.comment == 'true' }}
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        VERSIONCAM_ACTION_REPORT: ${{ steps.run.outputs.report }}
        VERSIONCAM_ACTION_STATUS: ${{ steps.run.outputs.status }}
        VERSIONCAM_ACTION_ARTIFACT_URL: ${{ steps.upload-failures.outputs.artifact-url }}
        VERSIONCAM_ACTION_WORKING_DIRECTORY: ${{ inputs.working-directory }}
      run: |
        # versioncam: the pull request comment of a failing check, or of one that passes again
        node "$GITHUB_ACTION_PATH/scripts/comment.mjs" \
          --report "$VERSIONCAM_ACTION_REPORT" --status "$VERSIONCAM_ACTION_STATUS" \
          --artifact-url "$VERSIONCAM_ACTION_ARTIFACT_URL" \
          --working-directory "$VERSIONCAM_ACTION_WORKING_DIRECTORY"

    - name: Result
      id: result
      if: always()
      shell: bash
      env:
        VERSIONCAM_ACTION_MODE: ${{ inputs.mode }}
        VERSIONCAM_ACTION_STATUS: ${{ steps.run.outputs.status }}
        VERSIONCAM_ACTION_HEADLINE: ${{ steps.summary.outputs.headline }}
        VERSIONCAM_ACTION_SESSION: ${{ steps.setup.outputs.storage-state }}
      run: |
        # versioncam: pass or fail, and the job fails here, after the summary and the comment, when versioncam failed
        if [ -n "$VERSIONCAM_ACTION_SESSION" ]; then rm -f "$VERSIONCAM_ACTION_SESSION"; fi
        if [ "$VERSIONCAM_ACTION_STATUS" = "0" ]; then
          echo "result=pass" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        echo "result=fail" >> "$GITHUB_OUTPUT"
        # No status means an earlier step stopped the Action and said why.
        if [ -n "$VERSIONCAM_ACTION_STATUS" ]; then
          echo "::error::${VERSIONCAM_ACTION_HEADLINE:-versioncam $VERSIONCAM_ACTION_MODE failed; its output above says why.}"
          exit 1
        fi
