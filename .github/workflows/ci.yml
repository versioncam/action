name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing is granted that a job does not name.
permissions:
  contents: read

jobs:
  scripts:
    name: The scripts' tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node --test

  # The Action on its own test app, as a customer's workflow would run it:
  # check, then render what the check recorded. On the acceptance branch that
  # renames the button, the check fails here and comments on its pull request.
  test-app:
    name: The Action on its test app
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # the comment on a failing check
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # `npm ci`: the lockfile pins versioncam as the registry serves it, so
      # every run installs the same recorder a customer would get.
      - name: Install the test app
        working-directory: test-app
        run: npm ci

      - name: Check
        id: check
        uses: ./
        with:
          working-directory: test-app
          # An empty saved session: the storage-state path, from the input to
          # the file to the config to the browser, runs on every push.
          storage-state: '{"cookies":[],"origins":[]}'

      # render encodes with ffmpeg, which versioncam leaves to the system.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Render
        id: render
        uses: ./
        with:
          mode: render
          working-directory: test-app
          install-browser: false

      - name: The outputs say what happened
        env:
          CHECK_RESULT: ${{ steps.check.outputs.result }}
          CHECK_REPORT: ${{ steps.check.outputs.report }}
          RENDER_RESULT: ${{ steps.render.outputs.result }}
          RENDER_REPORT: ${{ steps.render.outputs.report }}
        run: |
          test "$CHECK_RESULT" = pass
          test "$RENDER_RESULT" = pass
          node -e '
            const fs = require("node:fs");
            const check = JSON.parse(fs.readFileSync(process.env.CHECK_REPORT, "utf8"));
            const render = JSON.parse(fs.readFileSync(process.env.RENDER_REPORT, "utf8"));
            if (!check.clips.every((c) => c.status === "pass")) throw new Error("a clip failed");
            const files = render.rendered.flatMap((r) => r.files);
            if (files.length !== 4 || !files.every((f) => fs.existsSync(f))) throw new Error("render is missing files");
            console.log(`checked ${check.clips.length} clip(s) with versioncam ${check.recorder}; rendered ${files.length} files`);
          '

      # What the check recorded, for the publish job below, on main: the
      # recordings alone, without the stability runs under `__`, kept a day.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: test-app-recordings
          path: |
            test-app/.versioncam/recordings
            !test-app/.versioncam/recordings/__*
          if-no-files-found: error
          retention-days: 1

  # On main, what the check recorded goes to version.cam, as a customer's
  # push job sends it: this repository is then a project there,
  # versioncam/action, with clips a stranger can open and a README badge
  # that is true. A job of its own, with the one permission publish needs:
  # any step of a job with id-token: write can ask GitHub for the token
  # version.cam accepts, an install script included, so this job installs
  # the test app without its scripts and takes the recordings from the job
  # above, which ran them.
  publish:
    name: Publish the test app's clips to version.cam
    needs: test-app
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # GitHub's token for version.cam, so no secret is stored
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install the test app, without its scripts
        working-directory: test-app
        run: npm ci --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: test-app-recordings
          path: test-app/.versioncam/recordings
      - name: Publish
        uses: ./
        with:
          mode: publish
          working-directory: test-app

  # publish without `id-token: write` must stop at once with one sentence.
  # Nothing is installed: the Action checks the job's permissions before it
  # looks for versioncam, so this job needs neither npm nor the service.
  publish-without-permission:
    name: Publish without id-token stops
    runs-on: ubuntu-latest
    permissions:
      contents: read # and no id-token: write, on purpose
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Publish
        id: publish
        continue-on-error: true
        uses: ./
        with:
          mode: publish
          working-directory: test-app
      - name: It stopped, and the result says so
        env:
          OUTCOME: ${{ steps.publish.outcome }}
          RESULT: ${{ steps.publish.outputs.result }}
        run: |
          test "$OUTCOME" = failure
          test "$RESULT" = fail
